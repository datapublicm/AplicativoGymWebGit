name: Deploy AplicativoGym Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install model build dependencies
        run: pip install -r requirements-model.txt

      - name: Download official MakeHuman CC0 base mesh
        run: |
          mkdir -p .build-assets
          curl -fL \
            https://raw.githubusercontent.com/makehumancommunity/makehuman/master/makehuman/data/3dobjs/base.obj \
            -o .build-assets/makehuman-base.obj

      - name: Generate muscle-segmented GLB
        run: python tools/generate_model.py

      - name: Verify generated site assets
        run: |
          test -s site/index.html
          test -s site/main.js
          test -s site/models/human-muscle-v2.glb
          python - <<'PY'
          from pathlib import Path
          p = Path('site/models/human-muscle-v2.glb')
          assert p.stat().st_size > 250_000, p.stat().st_size
          print(f'GLB verified: {p.stat().st_size} bytes')
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
