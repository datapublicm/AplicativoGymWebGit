name: "GymLytics 01.10 - pruebas offline sin precarga"
on:
  push:
    branches:
      - cambios/gymlytics-01.08-offline-ubicacion-ejercicios-20261018
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validar-sin-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: Android-Gymlytics
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: "Sintaxis: archivos modificados"
        run: |
          node --check web/app.js
          node --check web/offline-first.js
          node --check web/gymlytics-cloud-v2.mjs
          node --check tools/verificar-inicio-vacio-chromium.mjs
          node --check web/catalog-offline-enhancements.js
          node --check web/sw.js
          node --check vite.config.js
      - name: "Semilla y pruebas estáticas"
        run: npm run test:static
      - name: "Chromium real e IndexedDB offline sin compilar"
        run: |
          npm install --no-package-lock --no-audit --no-fund
          node tools/verificar-inicio-vacio-chromium.mjs
      - name: "Integridad del paquete antes de compilar"
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const app=fs.readFileSync('web/offline-first.js','utf8');
          const sw=fs.readFileSync('web/sw.js','utf8');
          const config=fs.readFileSync('vite.config.js','utf8');
          if(app.includes("import {GYMLYTICS_SEED_PATH")||app.includes("installGymlyticsSeed(seed"))throw Error('Queda importación automática');
          if(sw.includes('hojamatriz-offline-20261018.json')||sw.includes('gymlytics-seed-offline.mjs'))throw Error('Archivo histórico en caché');
          if(config.includes("['assets','icons','data']"))throw Error('Vite copiaría archivos precargados');
          console.log('OK: sin precarga al abrir GymLytics');
          JS
