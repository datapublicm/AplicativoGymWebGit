# Compilación autorizada por el usuario: entrega 01.05 de apk/pruebas.
# No modifica ramas principales ni incorpora el modelo 3D pendiente.
name: Gymlytics - APK 01.05 Pruebas
on:
  push:
    branches:
      - apk/pruebas
    paths:
      - '.github/workflows/compilar-gymlytics-debug.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compilar-apk:
    name: Construir APK debug Gymlytics 01.05
    if: github.ref == 'refs/heads/apk/pruebas'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    defaults:
      run:
        working-directory: Android-Gymlytics
    env:
      VITE_SUPABASE_URL: https://jasuqnxrskhqfobsazwd.supabase.co
      VITE_SUPABASE_SCHEMA: sch_android_gymlytics
      VITE_GYMLYTICS_ENVIRONMENT: pruebas
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_sQH_z37OD2mzNMoL4M3Lwg_jF8Lpmx2
      VITE_GYMLYTICS_RECOVERY_URL: ''
    steps:
      - name: Descargar exclusivamente apk/pruebas
        uses: actions/checkout@v4
        with:
          ref: apk/pruebas
      - name: Comprobar rama, proyecto y version
        run: |
          test "${GITHUB_REF_NAME}" = "apk/pruebas"
          test ! -d android/app
          test -f android/README.md
          node -e 'const p=require("./package.json"); const c=require("./capacitor.config.json");if(p.name!=="gymlytics"||p.version!=="0.1.5"||c.appId!=="com.datapublicm.gymlytics")process.exit(1)'
          test "${VITE_SUPABASE_SCHEMA}" = sch_android_gymlytics
      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Preparar SDK Android
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          test -x "$SDK/cmdline-tools/latest/bin/sdkmanager"
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Ejecutar pruebas estaticas antes de crear node_modules
        run: npm run test:static
      - name: Instalar dependencias de JavaScript
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Construir web con datos de Supabase Pruebas
        run: |
          node -e 'if(!process.env.VITE_SUPABASE_PUBLISHABLE_KEY?.startsWith("sb_publishable_"))process.exit(1)'
          npm run build:web
          test -s dist/index.html
      - name: Crear plataforma Android temporal
        run: |
          test -f android/README.md
          test "$(find android -mindepth 1 -maxdepth 1 | wc -l)" -eq 1
          mv android/README.md android-notas-de-plataforma.txt
          rmdir android
          npx cap add android
          npx cap sync android
      - name: Establecer version interna 01.05 y codigo 5
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'android/app/build.gradle';
          let gradle = fs.readFileSync(file,'utf8');
          if (!/versionCode\s+\d+/.test(gradle) || !/versionName\s+["'][^"']+["']/.test(gradle))
            throw Error('No se encontró versión Android en Gradle');
          gradle = gradle.replace(/versionCode\s+\d+/,'versionCode 5')
                         .replace(/versionName\s+["'][^"']+["']/,'versionName "01.05"');
          fs.writeFileSync(file,gradle);
          if (!gradle.includes('versionCode 5') || !gradle.includes('versionName "01.05"'))
            throw Error('La numeración Android no se aplicó');
          NODE
      - name: Compilar APK Android debug
        working-directory: Android-Gymlytics/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug
      - name: Verificar APK y firma digital
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep '^package:' | tee /tmp/gymlytics-package.txt
          grep -q "name='com.datapublicm.gymlytics'" /tmp/gymlytics-package.txt
          grep -q "versionCode='5'" /tmp/gymlytics-package.txt
          grep -q "versionName='01.05'" /tmp/gymlytics-package.txt
          mkdir -p entregables
          cp "$APK" entregables/Gymlytics_01.05_Pruebas.apk
          (cd entregables && sha256sum Gymlytics_01.05_Pruebas.apk > SHA256.txt)
          ls -lh entregables/
      - name: Publicar APK para descarga
        uses: actions/upload-artifact@v4
        with:
          name: Gymlytics_01.05_Pruebas_APK
          path: Android-Gymlytics/entregables/
          if-no-files-found: error
          retention-days: 30
