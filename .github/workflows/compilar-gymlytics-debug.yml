name: Gymlytics - compilar APK debug (Supabase Pruebas)
on:
  push:
    branches: [Android-Gymlytics]
    paths:
      - '.github/workflows/compilar-gymlytics-debug.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compilar-apk:
    name: Generar APK instalable sin modelo 3D
    runs-on: ubuntu-latest
    timeout-minutes: 50
    defaults:
      run:
        working-directory: Android-Gymlytics
    env:
      VITE_SUPABASE_URL: https://jasuqnxrskhqfobsazwd.supabase.co
      VITE_SUPABASE_SCHEMA: sch_android_gymlytics
      VITE_GYMLYTICS_ENVIRONMENT: pruebas
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_sQH_z37OD2mzNMoL4M3Lwg_jF8Lpmx2
      VITE_GYMLYTICS_RECOVERY_URL: ''
    steps:
      - name: Extraer rama autorizada
        uses: actions/checkout@v4
      - name: Preparar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Usar SDK Android preinstalado en GitHub
        run: |
          SDK=${ANDROID_HOME:-/usr/local/lib/android/sdk}
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          test -x "$SDK/cmdline-tools/latest/bin/sdkmanager"
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --list_installed | head -60
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Validar que no se compilen modificaciones del modelo 3D
        run: |
          test "${GITHUB_REF_NAME}" = "Android-Gymlytics"
          test ! -d android/app
          test -f capacitor.config.json
      - name: Instalar dependencias web y Capacitor
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Compilar recursos web con conexión de Pruebas
        run: |
          node -e "if(!process.env.VITE_SUPABASE_PUBLISHABLE_KEY?.startsWith('sb_publishable_'))process.exit(1)"
          npm run build:web
          test -f dist/index.html
          test -f dist/assets/jalon-pecho.webp
      - name: Generar proyecto Android con Capacitor
        run: |
          # El repositorio solo guarda android/README.md; retirar esa carpeta
          # reservada en el runner efímero para permitir crear la plataforma.
          test -f android/README.md
          test "$(find android -mindepth 1 -maxdepth 1 | wc -l)" -eq 1
          mv android/README.md android-notas-de-plataforma.txt
          rmdir android
          npx cap add android
      - name: Sincronizar archivos a Android
        run: npx cap sync android
      - name: Construir APK debug
        working-directory: Android-Gymlytics/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug
      - name: Verificar archivo e identificar su tamaño
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          ls -lh "$APK"
          mkdir -p entregables
          cp "$APK" entregables/Gymlytics-v0.1.3-Pruebas-debug.apk
          sha256sum entregables/Gymlytics-v0.1.3-Pruebas-debug.apk > entregables/SHA256.txt
      - name: Publicar APK descargable
        uses: actions/upload-artifact@v4
        with:
          name: Gymlytics-v0.1.3-Pruebas-APK
          path: Android-Gymlytics/entregables/
          if-no-files-found: error
          retention-days: 30
