name: Gymlytics APK pruebas - validacion sin compilacion
on:
  push:
    branches:
      - apk/pruebas
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Android-Gymlytics
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Revisar sintaxis de interfaz y acceso a Supabase
        run: |
          node --check web/app.js
          node --check web/auth-cloud.js
          node --check web/offline-first.js
          node --check web/profile-policy.js
          node --check web/cloud-sync.js
          node --check web/sync-engine.js
          node --check web/catalogo.js
          node --check tools/validar-data-api.mjs
      - name: Ejecutar pruebas unitarias y de regresion
        run: npm run test:static
      - name: Validar 24 escenarios Chrome movil sin APK
        run: node tools/verificar-layout-mobile.mjs
      - name: Guardar capturas moviles para revision
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gymlytics-apk-pruebas-mockups-reales
          path: Android-Gymlytics/mobile-check/*.png
          if-no-files-found: ignore
      - name: Confirmar que no se generaron binarios
        run: |
          test ! -d dist
          test ! -d android/app
          test ! -d node_modules
