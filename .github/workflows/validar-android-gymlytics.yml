name: Gymlytics - pruebas estáticas (sin APK)
on:
  push:
    branches: [Android-Gymlytics]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validar-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Android-Gymlytics
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Comprobar sintaxis JS
        run: |
          node --check web/app.js
          node --check web/auth-cloud.js
          node --check vite.config.js
          node --check tools/validar-data-api.mjs
          node --check tools/verificar-salud-supabase.mjs
      - name: Verificar pruebas del proyecto
        run: npm run test:static
      - name: Comprobar salud HTTP de Supabase Pruebas sin credenciales
        continue-on-error: true
        run: node tools/verificar-salud-supabase.mjs
      - name: No se han compilado artefactos
        run: |
          test ! -d android/app
          test ! -d dist
          test ! -d node_modules
