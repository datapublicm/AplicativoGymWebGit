name: Task 13.2C — Male basemesh preparation

on:
  push:
    branches:
      - feature/task-13-2c-male-basemesh
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare-basemesh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install mesh tooling
        run: python -m pip install --disable-pip-version-check trimesh numpy
      - name: Prepare hm08 body-only basemesh
        run: python tools/task_13_2c_prepare_basemesh.py
      - name: Verify prepared artifacts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("artifacts/task-13-2c/basemesh_stats.json")
          d=json.loads(p.read_text())
          assert d["source_sha256_matches"] is True
          assert d["body_components"] == 1
          assert d["body_vertices"] > 10000
          assert d["body_faces"] > 10000
          assert d["glb_bytes"] > 100000
          print(json.dumps(d, indent=2))
          PY
      - name: Upload Task 13.2C artifacts
        uses: actions/upload-artifact@v4
        with:
          name: task-13-2c-male-basemesh
          path: artifacts/task-13-2c/
          if-no-files-found: error
          retention-days: 14
