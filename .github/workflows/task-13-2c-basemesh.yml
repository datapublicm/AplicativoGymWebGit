name: Task 13.2C — Male anatomical basemesh

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - feature/task-13-2c-male-basemesh-main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install mesh tooling
        run: python -m pip install --disable-pip-version-check trimesh numpy
      - name: Run Task 13.2C preparation
        run: python tools/task_13_2c_prepare_basemesh.py
      - name: Verify contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("artifacts/task-13-2c/basemesh_stats.json").read_text())
          assert d["source_sha256_matches"] is True
          assert d["components"] == 1
          assert d["vertices"] > 10000
          assert d["faces"] > 10000
          assert d["glb_bytes"] > 100000
          assert d["male_glb_bytes"] > 100000
          print(json.dumps(d, indent=2))
          PY
      - name: Upload prepared basemesh
        uses: actions/upload-artifact@v4
        with:
          name: task-13-2c-male-basemesh
          path: artifacts/task-13-2c/
          if-no-files-found: error
          retention-days: 14