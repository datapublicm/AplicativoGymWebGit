name: Renombrar rama Android-GymLog a Android-Gymlytics
on:
  push:
    branches:
      - Android-GymLog
permissions:
  contents: write
jobs:
  rename:
    if: ${{ github.repository == 'datapublicm/AplicativoGymWebGit' && github.ref == 'refs/heads/Android-GymLog' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Rename only the existing Android branch using GitHub REST API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/rename-branch-response.json -w '%{http_code}' \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${TARGET_REPO}/branches/Android-GymLog/rename" \
            -d '{"new_name":"Android-Gymlytics"}')
          if [[ "$code" == "201" ]]; then
            echo "La rama se renombró a Android-Gymlytics (HTTP $code)."
          else
            echo "Renombrado no ejecutado (HTTP $code)."
            cat /tmp/rename-branch-response.json
            exit 1
          fi
