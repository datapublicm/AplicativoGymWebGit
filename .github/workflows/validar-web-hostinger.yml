name: Web-Hostinger - pruebas de código (sin despliegue)
on:
  push:
    branches: [Web-Hostinger]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validar-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Tests de estructura
        run: node --test Web-Hostinger/tests/*.test.mjs
      - name: Sintaxis JavaScript
        run: |
          find Web-Hostinger -type f -name '*.js' -print0 | while IFS= read -r -d '' archivo; do
            node --check "$archivo"
          done
